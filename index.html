<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="专属家庭徒手训练计划、饮食补剂提醒与身体数据追踪">
<meta name="theme-color" content="#0B0E11">
<title>练记 · 家庭健身打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="练记">
<style>
:root{
  --bg:#0B0E11; --card:#161B22; --card2:#0D1117; --line:#232A33;
  --txt:#E6EDF3; --dim:#8B949E; --accent:#A3E635; --green:#34D399;
  --red:#F87171; --warn:#FBBF24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  line-height:1.55;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
#app{max-width:640px;margin:0 auto;padding:0 14px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}
.topbar h1{font-size:22px;letter-spacing:1px}
.beta{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
.topline{font-size:13px;color:var(--dim);margin-top:2px}
.pill-btn{background:rgba(163,230,53,.12);color:var(--accent);border:1px solid rgba(163,230,53,.35);border-radius:99px;padding:8px 14px;font-size:13px;min-height:40px}
.hidden{display:none!important}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.sec-title{font-size:14px;color:var(--dim);margin:18px 4px 10px;font-weight:600}
.card h3{font-size:16px;margin-bottom:6px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-hint{font-size:13px;color:var(--dim)}
.small{font-size:12px}
.dim{color:var(--dim)}
.warn{color:var(--warn)}
.pill{background:rgba(163,230,53,.12);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.done{background:rgba(52,211,153,.14);color:var(--green)}
.plan-title{font-size:19px;margin:8px 0 4px}
.plan-sub{font-size:13px;color:var(--dim)}
.ex-mini-list{margin:12px 0}
.ex-mini{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ex-mini:last-child{border-bottom:none}
.btn{min-height:46px;padding:0 16px;background:#21262D;color:var(--txt);border:1px solid #30363D;border-radius:12px;font-size:14px;cursor:pointer}
.btn-big{width:100%;min-height:54px;background:var(--accent);color:#0B0E11;font-weight:700;border:none;border-radius:14px;font-size:16px;cursor:pointer}
.btn-big:active,.btn:active,.rest-btn:active,.tab-btn:active,.status-row button:active,.mode-btn:active{transform:scale(.97)}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;min-height:40px;padding:0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-bottom:0}
.mini-title{font-size:13px;color:var(--dim)}
.mini-num{font-size:22px;font-weight:700;margin:4px 0}
.mini-num small{font-size:12px;color:var(--dim);font-weight:400}
.status-row{display:flex;gap:8px;margin-top:10px}
.status-row button{flex:1;min-height:54px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:14px;font-size:13px;cursor:pointer;padding:6px}
.status-row button.active{background:rgba(163,230,53,.12);border-color:var(--accent);color:var(--accent);font-weight:600}
.rem-row{display:flex;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.rem-row:last-of-type{border-bottom:none}
.rem-row span{color:var(--accent);min-width:52px;font-weight:600}
.tip-card{font-size:13px;color:var(--dim);border-style:dashed}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;cursor:pointer;min-height:60px}
.tab-btn .ic{width:23px;height:23px}
.tab-btn.active{color:var(--accent)}
.mode-switch{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:10px 0}
.mode-btn{flex:1;min-height:44px;border:none;background:transparent;color:var(--dim);font-size:14px;border-radius:9px;cursor:pointer}
.mode-btn.active{background:var(--accent);color:#0B0E11;font-weight:700}
.ex-card{padding:0;overflow:hidden}
.ex-top{display:flex;align-items:center;gap:10px;padding:14px 14px 12px}
.check input{display:none}
.check span{display:inline-block;width:26px;height:26px;border:2px solid #30363D;border-radius:8px;position:relative;cursor:pointer;flex-shrink:0}
.check input:checked + span{background:var(--accent);border-color:var(--accent)}
.check input:checked + span:after{content:'';position:absolute;left:8px;top:4px;width:6px;height:12px;border:solid #0B0E11;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:600}
.ex-meta{font-size:12px;color:var(--dim);margin-top:2px}
.rest-btn{min-height:42px;padding:0 12px;background:#21262D;border:1px solid #30363D;color:var(--accent);border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap}
.ex-card details{border-top:1px solid var(--line)}
.ex-card summary{list-style:none;padding:13px 16px;color:var(--dim);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.ex-card summary::-webkit-details-marker{display:none}
.ex-card summary:before{content:'▸';color:var(--accent);transition:transform .2s}
.ex-card details[open] summary:before{transform:rotate(90deg)}
.ex-body{padding:4px 16px 16px;font-size:13px}
.ex-body h4{font-size:12px;color:var(--accent);margin:12px 0 4px}
.ex-body p{color:#C9D1D9}
.mistake-line{color:#FBBF24}
.video-row{display:flex;gap:8px;margin-top:12px}
.video-btn{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:#21262D;border:1px solid #30363D;color:var(--txt);border-radius:10px;font-size:13px;text-decoration:none}
.video-btn.bili{color:#4FC3F7}
.video-btn.xhs{color:#F87171}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.form-grid label{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.form-grid input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:16px;color-scheme:dark;min-width:0;width:100%}
.chart-box{margin-bottom:14px}
.chart-title{font-size:13px;color:var(--dim);margin-bottom:6px}
.chart{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px}
.chart-svg{width:100%;height:auto;display:block}
.grid-line{stroke:#232A33;stroke-width:1}
.axis-txt{font-size:9px;fill:#8B949E}
.empty-chart{color:var(--dim);font-size:13px;padding:18px 8px;text-align:center}
.stat-label{font-size:13px;color:var(--dim)}
.stat-num{font-size:26px;font-weight:700;margin:4px 0}
.stat-sub{font-size:12px;color:var(--dim)}
.adapt-list{font-size:13px;color:#C9D1D9;padding-left:4px}
.adapt-list li{margin:6px 0 6px 16px}
.hist-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-date{min-width:56px;color:var(--dim)}
.hist-vals{flex:1}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}
.check-row:last-of-type{border-bottom:none}
.check-row input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.check-row .dim{margin-left:auto}
.progress{background:var(--card2);border-radius:99px;height:10px;overflow:hidden;margin:10px 0 6px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .3s}
.progress-txt{font-size:12px;color:var(--dim)}
.water-num{font-size:26px;font-weight:700;margin:6px 0}
.water-num small{font-size:13px;color:var(--dim);font-weight:400}
.water-btns{display:flex;gap:8px;margin-top:10px}
.water-btns .btn-big{flex:1}
.meal-item{border-bottom:1px dashed var(--line);padding:10px 0;font-size:13px}
.meal-item:last-child{border-bottom:none}
.meal-time{color:var(--accent);font-weight:600;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-box{background:var(--card);border:1px solid #2A313C;border-radius:20px;padding:20px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:8px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.modal-actions .btn-big{flex:1.5}
.timer-title{font-size:14px;color:var(--dim);text-align:center}
.timer-num{font-size:64px;font-weight:800;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.timer-sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#21262D;border:1px solid #30363D;color:var(--txt);padding:12px 18px;border-radius:14px;font-size:14px;z-index:200;max-width:86vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1>练记<span class="beta">家庭健身打卡</span></h1>
      <p id="todayLine" class="topline"></p>
    </div>
    <button id="installBtn" class="pill-btn hidden" onclick="installApp()">安装到桌面</button>
  </header>

  <main>
    <section id="view-home" class="view active">
      <div class="card" id="homePlan"></div>
      <h2 class="sec-title">今日状态反馈</h2>
      <div class="card">
        <p class="card-hint">训练后的肌肉感受：</p>
        <div class="status-row" id="statusRow">
          <button data-status="ok" onclick="setStatus('ok')">正常酸痛</button>
          <button data-status="heavy" onclick="setStatus('heavy')">重度酸痛</button>
          <button data-status="pain" onclick="setStatus('pain')">关节刺痛</button>
        </div>
      </div>
      <h2 class="sec-title">今日概览</h2>
      <div class="grid2">
        <div class="card" id="homeWater"></div>
        <div class="card" id="homeProtein"></div>
      </div>
      <div class="card" id="reminderCard"></div>
      <div class="card tip-card">训练时间建议：午饭后1小时，或晚饭后2–3小时。无器械动作也能有效增肌，关键是「渐进超负荷」：每周比上周多做1–2次或加一点负重。</div>
    </section>

    <section id="view-train" class="view">
      <div class="card" id="trainHead"></div>
      <div id="trainList"></div>
      <div class="card">
        <button id="finishWorkout" class="btn-big" onclick="finishWorkout()">完成今日训练</button>
      </div>
    </section>

    <section id="view-data" class="view">
      <div class="card">
        <h3>记录身体数据</h3>
        <p class="card-hint">体重、围度每周测1–2次（晨起空腹最准）。胸围/肩宽用于评估上下半身比例。</p>
        <div class="form-grid">
          <label>体重 kg<input id="inWeight" type="number" inputmode="decimal" placeholder="72"></label>
          <label>胸围 cm<input id="inChest" type="number" inputmode="decimal" placeholder="95"></label>
          <label>肩宽 cm<input id="inShoulder" type="number" inputmode="decimal" placeholder="42"></label>
          <label>腰围 cm<input id="inWaist" type="number" inputmode="decimal" placeholder="78"></label>
          <label>大腿围 cm<input id="inThigh" type="number" inputmode="decimal" placeholder="56"></label>
          <label>日期<input id="inDate" type="date"></label>
        </div>
        <button class="btn-big" onclick="addMeasure()">保存记录</button>
      </div>
      <div class="card" id="adaptCard"></div>
      <div class="card">
        <h3>变化趋势</h3>
        <div class="chart-box"><div class="chart-title">体重 kg</div><div id="chartWeight" class="chart"></div></div>
        <div class="chart-box"><div class="chart-title">胸围 cm</div><div id="chartChest" class="chart"></div></div>
        <div class="chart-box"><div class="chart-title">肩宽 cm</div><div id="chartShoulder" class="chart"></div></div>
        <div class="chart-box"><div class="chart-title">腰围 cm</div><div id="chartWaist" class="chart"></div></div>
        <div class="chart-box"><div class="chart-title">大腿围 cm</div><div id="chartThigh" class="chart"></div></div>
      </div>
      <div class="grid2">
        <div class="card" id="statBmi"></div>
        <div class="card" id="statBalance"></div>
      </div>
      <div class="card" id="historyCard">
        <h3>最近记录</h3>
        <div id="historyList"></div>
      </div>
    </section>

    <section id="view-diet" class="view">
      <div class="card" id="creatineCard"></div>
      <h2 class="sec-title">每日饮食模板</h2>
      <div class="card" id="mealCard"></div>
      <h2 class="sec-title">蛋白质摄入</h2>
      <div class="card" id="proteinCard"></div>
      <h2 class="sec-title">饮水 2.5L</h2>
      <div class="card" id="waterCard"></div>
      <div class="card" id="dietNote"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="home" onclick="switchView('home')">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>首页</span>
    </button>
    <button class="tab-btn" data-view="train" onclick="switchView('train')">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6.5" y1="6.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="17.5" y2="17.5"/><line x1="3" y1="9" x2="3" y2="15"/><line x1="21" y1="9" x2="21" y2="15"/><line x1="6.5" y1="12" x2="17.5" y2="12"/></svg>
      <span>训练</span>
    </button>
    <button class="tab-btn" data-view="data" onclick="switchView('data')">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8 3 2"/><path d="M3 20h18"/></svg>
      <span>数据</span>
    </button>
    <button class="tab-btn" data-view="diet" onclick="switchView('diet')">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>
      <span>饮食</span>
    </button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
var LS = 'lianji_v2';
var DEFAULTS = { profile:{height:174, weight:72}, overrides:{}, workouts:{}, statuses:{}, diet:{}, measurements:[], settings:{notif:true, tea:true, mode:'home'} };
var data = load();
var SEQ = ['A','B','C','rest'];
var PLAN_TITLE = { A:'Day A · 上肢推 + 核心 + 小臂', B:'Day B · 上肢拉 + 核心 + 小臂', C:'Day C · 下肢塑形 + 有氧', rest:'休息日 · 主动恢复' };
var PLAN_FOCUS = { A:'胸 · 肩 · 肱三头 · 核心 · 前臂', B:'背 · 肩后束 · 核心 · 前臂握力', C:'臀腿塑形 · 心肺燃脂', rest:'拉伸 · 散步 · 睡眠' };
var PLAN = {
A:{ list:[
 {id:'pushup', name:'俯卧撑', target:'胸 / 肱三头 / 肩', sets:'3', reps:'8–12', rest:90,
  steps:'1. 双手略宽于肩撑地，身体从头到脚一条直线；2. 吸气屈肘下降，胸口接近地面；3. 呼气推起，肘部不锁死；4. 全程收紧腹部臀部，不塌腰不撅臀。',
  regress:'墙壁俯卧撑：面对墙推墙，站得越直越简单，3×10–12。上斜俯卧撑：手扶椅子/桌面。',
  progress:'窄距俯卧撑、下斜俯卧撑（脚垫高），或背包装书负重。',
  mistakes:'塌腰、耸肩、只做半程、肘部外展过大。',
  kw:'俯卧撑 标准动作 教学',
  gym:{ name:'杠铃卧推', equip:'杠铃 + 平板凳', sets:'3', reps:'8–10', rest:90,
    steps:'1. 肩胛后收下沉，双脚踩实；2. 杠铃下放至胸线下沿，小臂垂直地面；3. 推起至肘微屈不锁死。',
    regress:'先用空杆学轨迹，或换哑铃卧推。', progress:'上斜/下斜卧推，或递增重量。',
    tips:'先做1–2组轻重量热身，正式组最后2次略吃力为宜。', kw:'杠铃卧推 标准动作 教学' } },
 {id:'pike', name:'派克俯卧撑', target:'肩 / 上胸 / 肱三头', sets:'3', reps:'8–10', rest:90,
  steps:'1. 平板支撑起始，臀部向上顶起呈倒V；2. 屈肘让头顶向双手之间下降；3. 推回倒V；4. 全程背部平直，颈放松。',
  regress:'手扶椅子做上斜派克，或跪姿半程。',
  progress:'脚垫高派克、单腿派克俯卧撑。',
  mistakes:'颈部前伸、臀部不够高、下降过深。',
  kw:'派克俯卧撑 教学',
  gym:{ name:'哑铃坐姿推举', equip:'哑铃 + 靠背凳', sets:'3', reps:'8–12', rest:90,
    steps:'1. 坐姿靠背，哑铃举至耳侧；2. 垂直上推至头顶，不耸肩；3. 缓慢下放到耳侧。',
    regress:'小重量或单臂交替。', progress:'站姿推举、递增重量。',
    tips:'腰背贴紧靠背，不要反弓借力。', kw:'哑铃坐姿推举 教学' } },
 {id:'dips', name:'椅子臂屈伸', target:'肱三头', sets:'3', reps:'10–15', rest:60,
  steps:'1. 背对稳固椅子，双手撑椅面前缘；2. 双腿前伸（屈膝更简单），身体下沉；3. 屈肘约90°，肩放松下沉；4. 三头发力撑起，不耸肩。',
  regress:'屈膝、脚靠近椅子，下降幅度减半。',
  progress:'双腿伸直、脚垫高，或大腿上放书包。',
  mistakes:'耸肩、下放过深压肩、身体离椅子太远。',
  kw:'椅子臂屈伸 教学',
  gym:{ name:'绳索下压', equip:'龙门架 + 绳索', sets:'3', reps:'12–15', rest:60,
    steps:'1. 面对龙门架，肘夹在身体两侧；2. 三头发力下压至手臂伸直；3. 缓慢还原至前臂略高于水平。',

function $(id){ return document.getElementById(id); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function merge(a,b){
  for(var k in b){
    if(Object.prototype.hasOwnProperty.call(b,k)){
      if(b[k] && typeof b[k]==='object' && !(b[k] instanceof Array)){
        if(!a[k] || typeof a[k]!=='object'){ a[k] = {}; }
        merge(a[k], b[k]);
      } else { a[k] = b[k]; }
    }
  }
  return a;
}
function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw){ return clone(DEFAULTS); }
    return merge(clone(DEFAULTS), JSON.parse(raw));
  }catch(e){ return clone(DEFAULTS); }
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dateStr(new Date()); }
function addDays(ds,n){ var d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); }
function epochDays(ds){ var d=new Date(ds+'T00:00:00'); return Math.floor(d.getTime()/86400000); }
function mod(n,m){ return ((n%m)+m)%m; }
function fmt(ds){ var d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function weekday(ds){ var w=['日','一','二','三','四','五','六']; return '周'+w[new Date(ds+'T00:00:00').getDay()]; }
function dietToday(){
  var ds = today();
  if(!data.diet[ds]){ data.diet[ds] = { creatine:false, protein:{}, water:0 }; }
  return data.diet[ds];
}
function planFor(ds){
  if(data.overrides[ds]){ return data.overrides[ds]; }
  return SEQ[mod(epochDays(ds), 4)];
}
function getMode(){ return data.settings.mode === 'gym' ? 'gym' : 'home'; }
function setMode(m){
  data.settings.mode = (m === 'gym') ? 'gym' : 'home';
  save(); renderHome(); renderTrain();
  toast(data.settings.mode === 'gym' ? '已切换到健身房模式' : '已切换到家庭模式');
}
function val(v,u){ return v==null ? '--' : v+u; }
function progressHtml(cur,target){
  var pct = Math.min(100, Math.round(cur/target*100));
  return '<div class="progress"><div class="progress-bar" style="width:'+pct+'%"></div></div><div class="progress-txt">'+cur+' / '+target+' · '+pct+'%</div>';

/* ---------- 体态自适应规则 ---------- */
function latestWeight(){
  var m = data.measurements.slice().sort(function(a,b){ return a.d<b.d?-1:1; });
  for(var i=m.length-1;i>=0;i--){ if(m[i].weight!=null){ return m[i].weight; } }
  return data.profile.weight || 72;
}
function trendOf(key){
  var rows = data.measurements.slice().sort(function(a,b){ return a.d<b.d?-1:1; }).filter(function(r){ return r[key]!=null; });
  if(rows.length < 2){ return null; }
  var recent = rows.slice(-4);
  return recent[recent.length-1][key] - recent[0][key];
}
function computeAdaptation(){
  var m = data.measurements.slice().sort(function(a,b){ return a.d<b.d?-1:1; });
  var out = { notes:[], mods:{ upperExtra:0, cardio:null } };
  if(!m.length){
    out.notes.push('先记录体重/腰围/大腿围/胸围，系统会自动生成训练调整建议。');
    return out;
  }
  var last = m[m.length-1];
  var h = data.profile.height || 174;
  var w = last.weight || data.profile.weight || 72;
  var bmi = w/Math.pow(h/100,2);
  if(bmi >= 25){
    out.mods.cardio = '有氧 25–30 分钟';
    out.notes.push('BMI '+bmi.toFixed(1)+'（≥25）：减脂优先——有氧延长至25–30分钟，主食适当减量，蛋白保持。');
  } else if(bmi < 18.5){
    out.mods.cardio = '有氧 10–15 分钟';
    out.notes.push('BMI '+bmi.toFixed(1)+'（<18.5）：增肌优先——减少有氧，每日加餐约300kcal。');
  } else {
    out.mods.cardio = '有氧 20 分钟';
    out.notes.push('BMI '+bmi.toFixed(1)+'（正常）：增肌减脂塑形期，按当前计划执行。');
  }
  if(last.chest && last.thigh){
    var ct = last.chest/last.thigh;
    if(ct < 1.55){
      out.mods.upperExtra = 1;
      out.notes.push('胸围/大腿围 = '+ct.toFixed(2)+'（<1.55，上肢相对偏弱）：Day A/B 每个动作自动 +1 组，优先发展上肢。');
    } else if(ct > 1.80){
      out.notes.push('胸围/大腿围 = '+ct.toFixed(2)+'（>1.80，上肢比例较好）：保持现有上肢计划。');
    } else {
      out.notes.push('胸围/大腿围 = '+ct.toFixed(2)+'（1.55–1.80，上下比例较均衡）：维持计划。');
    }
  } else {
    out.notes.push('补记「胸围 + 大腿围」后，可评估上下半身比例并自动调整计划。');
  }
  var wt = trendOf('weight');
  var wst = trendOf('waist');
  if(wst!=null && wt!=null && wt<=0 && wst>0.5){
    out.notes.push('近4次记录：体重 '+wt.toFixed(1)+'kg 而腰围 +'+wst.toFixed(1)+'cm——体脂可能上升，建议控糖、控夜宵。');
  } else if(wst!=null && wst < -0.5){
    out.notes.push('腰围近4次下降 '+Math.abs(wst).toFixed(1)+'cm，减脂方向正确，继续保持。');
  }
  return out;
}

    beep();

  }

function beep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx){
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.2;
      o.start();
      setTimeout(function(){ try{ o.stop(); ctx.close(); }catch(e){} }, 350);
    }
  }catch(e){}
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
}

function addMeasure(){
  var w = parseFloat($('inWeight').value);
  var ch = parseFloat($('inChest').value);
  var sh = parseFloat($('inShoulder').value);
  var wa = parseFloat($('inWaist').value);
  var th = parseFloat($('inThigh').value);
  var d = $('inDate').value || today();
  if(isNaN(w) && isNaN(ch) && isNaN(sh) && isNaN(wa) && isNaN(th)){ toast('至少填写一项数据'); return; }
  var m = data.measurements;
  var rec = null;
  for(var i=0;i<m.length;i++){ if(m[i].d === d){ rec = m[i]; break; } }
  if(rec){
    if(!isNaN(w)){ rec.weight = w; }
    if(!isNaN(ch)){ rec.chest = ch; }
    if(!isNaN(sh)){ rec.shoulder = sh; }
    if(!isNaN(wa)){ rec.waist = wa; }
    if(!isNaN(th)){ rec.thigh = th; }
  } else {
    rec = { d:d, weight: isNaN(w)?null:w, chest: isNaN(ch)?null:ch, shoulder: isNaN(sh)?null:sh, waist: isNaN(wa)?null:wa, thigh: isNaN(th)?null:th };
    m.push(rec);
  }
  m.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  if(!isNaN(w)){ data.profile.weight = w; }
  save(); renderData(); renderHome(); renderTrain();
  toast('已保存 '+fmt(d)+' 的记录，训练建议已更新');
}
function delMeasure(idx){
  data.measurements.splice(idx,1);
  save(); renderData(); renderHome(); renderTrain();
}
function drawChart(elId, pts, color, unit){
  var el = $(elId); if(!el){ return; }
  if(!pts.length){ el.innerHTML = '<div class="empty-chart">暂无数据，先记录一次</div>'; return; }
  var W = 320, H = 130, padL = 34, padR = 10, padT = 12, padB = 22;
  var vals = pts.map(function(p){ return p.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min === max){ min -= 1; max += 1; }
  var rng = max - min;
  function X(i){ return padL + (W-padL-padR) * (pts.length===1 ? 0.5 : i/(pts.length-1)); }
  function Y(v){ return padT + (H-padT-padB) * (1 - (v-min)/rng); }
  var d = 'M'+X(0).toFixed(1)+' '+Y(vals[0]).toFixed(1);
  for(var i=1;i<pts.length;i++){ d += ' L'+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1); }
  var s = '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg">';
  for(var g=0;g<=2;g++){
    var gy = padT + (H-padT-padB)*g/2;
    s += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" class="grid-line"/>';
  }
  s += '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="'+color+'"/>';
  });
  s += '<text x="'+padL+'" y="'+(H-6)+'" class="axis-txt">'+fmt(pts[0].d)+'</text>';
  if(pts.length > 1){ s += '<text x="'+(W-padR)+'" y="'+(H-6)+'" class="axis-txt" text-anchor="end">'+fmt(pts[pts.length-1].d)+'</text>'; }
  s += '<text x="4" y="'+(Y(max)+4)+'" class="axis-txt">'+max.toFixed(max<10?1:0)+'</text>';
  s += '<text x="4" y="'+(Y(min)+4)+'" class="axis-txt">'+min.toFixed(min<10?1:0)+'</text>';
  var last = vals[vals.length-1];
  s += '<text x="'+(W-padR)+'" y="'+(Y(last)-6)+'" class="axis-txt" text-anchor="end" fill="'+color+'">'+last+unit+'</text>';
  s += '</svg>';
  el.innerHTML = s;
}

/* ---------- 饮食 ---------- */
function renderDiet(){
  var d = dietToday();
  var t = PROTEIN_TARGET();
  var c = '<div class="card-head"><h3>肌酸补剂提醒</h3><span class="pill">12:00</span></div>';
  c += '<p class="card-hint">每天午饭前5分钟：<b>5g 一水肌酸 + 150ml 温水</b>（不训练日也照常）。</p>';
  c += '<label class="check-row"><input type="checkbox" '+(d.creatine?'checked':'')+' onchange="toggleCreatine(this)"><span>今日已服用 ✓</span></label>';
  c += '<p class="dim small">若午饭不在12点，按「午饭前5分钟」自行调整。</p>';
  $('creatineCard').innerHTML = c;

  renderMeal();

  var sum = 0;
  var phtml = '<div class="card-head"><h3>蛋白质摄入</h3><span class="pill">目标 '+t+'g</span></div>';
  phtml += '<p class="card-hint">增肌减脂期建议 1.6g/kg 体重。勾选今天吃过的蛋白来源：</p>';
  PROTEIN_ITEMS.forEach(function(it){
    var on = d.protein && d.protein[it.id];
    if(on){ sum += it.g; }
    phtml += '<label class="check-row"><input type="checkbox" class="pro-check" data-id="'+it.id+'" '+(on?'checked':'')+'><span>'+it.name+'</span><span class="dim">+'+it.g+'g</span></label>';
  });
  phtml += progressHtml(sum, t);
  $('proteinCard').innerHTML = phtml;
  var pcs = $('proteinCard').querySelectorAll('.pro-check');
  for(var pi=0;pi<pcs.length;pi++){
    pcs[pi].onchange = function(){ toggleProtein(this.getAttribute('data-id'), this.checked); };
  }

  var w = d.water || 0;
  var wh = '<div class="card-head"><h3>饮水</h3><span class="pill">目标 2500ml</span></div>';
  wh += '<div class="water-num">'+w+' <small>/ 2500 ml</small></div>';
  wh += progressHtml(w, 2500);
  wh += '<div class="water-btns"><button class="btn" onclick="addWater(-250)">−250</button><button class="btn-big" onclick="addWater(250)">+250ml</button><button class="btn" onclick="addWater(500)">+500</button></div>';
  $('waterCard').innerHTML = wh;

  $('dietNote').innerHTML = '<h3>饮食要点</h3><p class="card-hint">1. 每餐都有蛋白质，训练后30–60分钟内补充吸收最好。<br>2. 全天饮水2.5L，训练日再加500ml。<br>3. 肌酸每天5g即可，坚持比时间点更重要。<br>4. 减脂期：主食减1/3、油盐控量；增肌期：主食加1/3、加餐跟上。</p>';
}
function renderMeal(){
  var w = latestWeight();
  var h = data.profile.height || 174;
  var bmi = w/Math.pow(h/100,2);
  var kcal = bmi>=25 ? Math.round(w*28) : (bmi<18.5 ? Math.round(w*34) : Math.round(w*30));
  var p = PROTEIN_TARGET();
  var html = '<div class="card-head"><h3>每日饮食模板</h3><span class="pill">约 '+kcal+' kcal</span></div>';
  html += '<p class="card-hint">蛋白目标 '+p+'g。训练日午餐/晚餐主食加1/3；休息日主食减量、蛋白不变。</p>';
  var meals = [
    { t:'早餐 7:00–8:30', f:'鸡蛋2个 + 牛奶250ml + 燕麦40g + 香蕉半根', pr:'约25g蛋白' },
    { t:'午餐 12:00–13:00', f:'米饭150g + 瘦肉/鱼150g + 蔬菜不限量', pr:'约40g蛋白' },
    { t:'加餐 15:00–16:00', f:'酸奶150g + 坚果15g（或蛋白粉1勺）', pr:'约20g蛋白' },
    { t:'晚餐 18:30–19:30', f:'红薯/玉米150g + 鸡肉/鱼120g + 蔬菜', pr:'约30g蛋白' }
  ];
  meals.forEach(function(m){ html += '<div class="meal-item"><div class="meal-time">'+m.t+'</div><div>'+m.f+'</div><div class="dim small">'+m.pr+'</div></div>'; });
  $('mealCard').innerHTML = html;
}
function toggleCreatine(cb){ dietToday().creatine = cb.checked; save(); renderDiet(); renderHome(); }
function toggleProtein(id, checked){ dietToday().protein[id] = checked; save(); renderDiet(); renderHome(); }
function addWater(ml){
  var d = dietToday();
  d.water = Math.max(0, Math.min(4000, d.water + ml));
  save(); renderDiet(); renderHome();
  if(d.water >= 2500 && ml > 0){ toast('今日饮水达标！很棒'); }
}

/* ---------- 提醒与PWA ---------- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e; $('installBtn').classList.remove('hidden');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; $('installBtn').classList.add('hidden'); });
  } else {
    toast('请用浏览器菜单选择「添加到主屏幕」');
  }
}
function enableNotif(){
  if(!('Notification' in window)){ toast('此浏览器不支持通知'); return; }
  Notification.requestPermission().then(function(p){
    if(p === 'granted'){
      toast('提醒已开启');
      notify('练记提醒已开启', '12:00肌酸 / 10:00喝茶 / 每2小时喝水');
    } else {
      toast('未获得通知权限，可到浏览器设置里开启');
    }
  });
}
function notify(title, body){
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(title, { body:body, icon:'icon-192.png', badge:'icon-192.png', vibrate:[100,50,100] });
      }).catch(function(){});
    } else {
      new Notification(title, { body:body });
    }
  }catch(e){}
}
function checkReminders(){
  var now = new Date();
  var hm = pad(now.getHours())+':'+pad(now.getMinutes());
  var h = now.getHours();
  var d = dietToday();
  if(hm === '12:00' && !d.creatine){
    notify('喝肌酸啦', '5g一水肌酸 + 150ml温水');
    toast('12:00 该喝肌酸了：5g + 150ml温水');
  }
  if(data.settings.tea && hm === '10:00'){
    notify('喝茶时间', '上午固定喝茶');
    toast('10:00 喝茶时间');
  }
  if(h>=8 && h<=22 && h%2===0 && now.getMinutes()===0 && d.water < 2500){
    notify('喝水提醒', '已喝 '+d.water+'ml / 2500ml');
  }
}
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ---------- 初始化 ---------- */
function renderAll(){ renderHome(); renderTrain(); renderData(); renderDiet(); }
renderAll();
checkReminders();
setInterval(checkReminders, 30000);
</script>
